upi_recon:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: /tmp/recon_gold.duckdb
      extensions: [iceberg, httpfs, postgres]
      settings:
        memory_limit: 256MB
        s3_endpoint: "{{ env_var('S3_ENDPOINT', 'minio:9000') }}"
        s3_use_ssl: false
        s3_url_style: path
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', 'minio') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', 'minio12345') }}"
      attach:
        - path: "dbname={{ env_var('POSTGRES_DB', 'fintech') }} user={{ env_var('POSTGRES_USER', 'app') }} password={{ env_var('POSTGRES_PASSWORD', 'app') }} host={{ env_var('POSTGRES_HOST', 'postgres') }} port={{ env_var('POSTGRES_PORT', '5432') }}"
          type: postgres
          alias: pg
      threads: 2
