name: simulation

# The reconciliation pipeline is a batch simulation: GitHub Actions runs the
# whole stack on a runner, lets it produce traffic, validates the result and
# publishes the metrics.  The Vercel dashboard and the Streamlit app read
# those metrics, so the simulation is visible without a long-lived server.
on:
  schedule:
    # every 30 minutes, off the top of the hour
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to let the pipeline run"
        default: "30"

concurrency:
  group: simulation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  simulate:
    name: run the reconciliation simulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POSTGRES_DSN: postgresql://app:app@localhost:5432/fintech
      MINUTES: ${{ github.event.inputs.minutes || '30' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # the publish step rebases the snapshot onto the current main
          fetch-depth: 0

      - name: Start the stack
        run: |
          set -euo pipefail
          docker compose up -d --build || {
            echo "--- the stack failed to start, here is what the one-shot init said ---"
            docker compose logs minio-init || true
            exit 1
          }
          docker compose ps

      - name: Wait for the pipeline to decide
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            n=$(docker compose exec -T postgres psql -U app -d fintech -t \
                  -c "select count(*) from recon.match_results" 2>/dev/null | tr -d ' ' || echo 0)
            echo "decisions so far: ${n:-0}"
            if [ "${n:-0}" -gt 100 ]; then break; fi
            sleep 20
          done

      - name: Unit tests
        run: |
          pip install --quiet pytest psycopg2-binary
          python -m pytest tests -q -m "not integration"

      - name: Let the traffic age so the recall window is meaningful
        run: |
          set -euo pipefail
          minutes="${MINUTES:-30}"
          echo "waiting ${minutes} minutes for the late-settlement repair window"
          sleep $(( minutes * 60 ))

      - name: Integration tests
        run: python -m pytest tests -q -m integration

      - name: Build the gold layer
        run: make dbt

      - name: Snapshot the metrics
        run: |
          python3 scripts/snapshot_metrics.py \
            --dsn "$POSTGRES_DSN" \
            --out runs/latest.json \
            --history runs/history.json

      - name: Publish the metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          auth="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # The snapshot is committed to main, which is what the site is built
          # from: every run therefore rebuilds the deployment with the fresh
          # numbers.  The push has to be rebased first - main may have moved
          # since the checkout.
          cd "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs
          if git diff --cached --quiet; then
            echo "nothing to publish (identical run)"
            exit 0
          fi
          git commit -q -m "chore: publish the simulation run $(date -u +%FT%TZ)"
          git fetch origin main
          git rebase origin/main
          git push "$auth" HEAD:main
          echo "published to main (the site rebuilds with the fresh numbers)"

      - name: Tear down
        if: always()
        run: docker compose down -v || true

      - name: Upload the metrics as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-metrics
          path: runs/
          retention-days: 30
